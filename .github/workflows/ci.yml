name: Build WhatsCLI Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Instalar dependências CGO
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64

      - name: Compilar executável Windows
        env:
          CGO_ENABLED: 1
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: go build -o whatscli.exe .

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: whatscli-executavel
          path: whatscli.exe
