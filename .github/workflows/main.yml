name: Build WhatsCLI Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Verificar ambiente
        shell: pwsh
        run: |
          go version
          gcc --version

      - name: Baixar dependências
        run: go mod download

      - name: Compilar WhatsCLI
        env:
          CGO_ENABLED: 1
        run: go build -o whatscli.exe .

      - name: Verificar executável
        shell: pwsh
        run: |
          Get-Item .\whatscli.exe
          .\whatscli.exe --help

      - name: Disponibilizar executável
        uses: actions/upload-artifact@v4
        with:
          name: whatscli-windows-amd64
          path: whatscli.exe
          if-no-files-found: error
